[project]
name = "ft-financial-digest"
version = "0.1.0"
description = "One-shot workflow: FT front page digest with podcast audio, sent by email"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
